spring:
  application:
    name: syndicate-loan
  datasource:
    # 5432 は他のアプリが使っていることがあるので、ローカルの PostgreSQL(compose.yaml)は 55432 で受ける。
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/syndicate_loan}
    username: ${DATABASE_USERNAME:syndicate_loan}
    password: ${DATABASE_PASSWORD:}
  jooq:
    sql-dialect: postgres
  mvc:
    problemdetails:
      enabled: true

server:
  # 8080 は他のアプリが使っていることがあるので避ける。
  port: ${SERVER_PORT:18080}
