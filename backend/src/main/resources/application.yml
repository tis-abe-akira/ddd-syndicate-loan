spring:
  application:
    name: syndicate-loan
  datasource:
    # 既定はローカルの PostgreSQL(compose.yaml)。5432 は他のアプリが使っていることがあるので 55432 で受ける。
    # パスワードは compose.yaml の開発用の値で、秘密ではない。本番では DATABASE_* で上書きする。
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${SYNDICATE_LOAN_DB_PORT:55432}/syndicate_loan}
    username: ${DATABASE_USERNAME:syndicate_loan}
    password: ${DATABASE_PASSWORD:syndicate_loan}
  jooq:
    sql-dialect: postgres
  mvc:
    problemdetails:
      enabled: true

server:
  # 8080 は他のアプリが使っていることがあるので避ける。
  port: ${SERVER_PORT:18080}
